<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon premier module JS</title>
</head>

<body>
    <div id="date">
        <p id="moment">
            <span id="heure"></span>
            <span id="minutes"></span>
            <span id="seconde"></span>
        </p>
    </div>

    <div id="utilisateur">
        <h2>Informations utilisateur</h2>
        <p><strong>Nom :</strong> <span id="nomUtilisateur"></span></p>
        <p><strong>Prénom :</strong> <span id="prenomUtilisateur"></span></p>
        <p><strong>Email :</strong> <span id="emailUtilisateur"></span></p>
        <p><strong>Mot de passe :</strong> <span id="motDePasseUtilisateur"></span></p>
    </div>
    
</body>
<script type="module" src="main.js"></script>
</html>
